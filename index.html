<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Mi Cuadrante</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#059669" />
    <style>
      /* Fondo IDÉNTICO al de la pantalla "Sincronizando…" de App.jsx. Pintado por
         el navegador antes de descargar y evaluar el bundle, así el arranque no
         pasa por un fogonazo en blanco camino de la app. */
      html, body {
        margin: 0;
        min-height: 100%;
        background: radial-gradient(circle at 50% 35%, #ecfdf5, #d1fae5 60%, #a7f3d0);
      }
      /* Lo sustituye React en su primer render (createRoot vacía #root). */
      #boot-loader {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #boot-loader .ring {
        width: 56px;
        height: 56px;
        border-radius: 50%;
        border: 4px solid rgba(5, 150, 105, 0.18);
        border-top-color: #059669;
        animation: boot-spin 0.9s linear infinite;
      }
      @keyframes boot-spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) {
        #boot-loader .ring { animation-duration: 2.4s; }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="boot-loader" role="status" aria-label="Cargando aplicación">
        <div class="ring"></div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
