workflows:
  ios-workflow:
    name: iOS App Store Build
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      groups:
        - apple_credentials
        # Config de Firebase para el .env del build. Se define en Codemagic >
        # Settings > Environment variables (grupo `firebase_config`). Antes estaba
        # aquí en texto plano y, por tanto, versionada en GitHub.
        # Variables que debe contener: VITE_FIREBASE_API_KEY, VITE_FIREBASE_AUTH_DOMAIN,
        # VITE_FIREBASE_PROJECT_ID, VITE_FIREBASE_STORAGE_BUCKET,
        # VITE_FIREBASE_MESSAGING_SENDER_ID, VITE_FIREBASE_APP_ID,
        # VITE_FIREBASE_MEASUREMENT_ID, VITE_ADMIN_EMAIL, VITE_FIREBASE_VAPID_KEY
        # y (opcional, cuando se active App Check) VITE_APPCHECK_SITE_KEY.
        - firebase_config
      vars:
        XCODE_SCHEME: "App"
        XCODE_PROJECT: "ios/App/App.xcodeproj"
        IOS_BUNDLE_ID: "com.cuadrantefetico.app"
      node: latest
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.cuadrantefetico.app
    scripts:
      - name: Install dependencies
        script: |
          npm install
      - name: Lint
        script: |
          # Falla solo con errores; los avisos no cortan el build.
          npm run lint
      - name: Run unit tests
        script: |
          # Si un test falla, el build se corta aquí y no llega nada roto a TestFlight.
          npm test
      - name: Create environment file
        script: |
          # .env está en .gitignore, así que hay que recrearlo para el build. Los
          # valores vienen del grupo cifrado `firebase_config` de Codemagic, NO del
          # repositorio. Si falta alguno, el build corta aquí en vez de generar un
          # .env a medias que produciría una app rota en TestFlight.
          set -eu
          : "${VITE_FIREBASE_API_KEY:?falta en el grupo firebase_config}"
          : "${VITE_FIREBASE_AUTH_DOMAIN:?falta en el grupo firebase_config}"
          : "${VITE_FIREBASE_PROJECT_ID:?falta en el grupo firebase_config}"
          : "${VITE_FIREBASE_STORAGE_BUCKET:?falta en el grupo firebase_config}"
          : "${VITE_FIREBASE_MESSAGING_SENDER_ID:?falta en el grupo firebase_config}"
          : "${VITE_FIREBASE_APP_ID:?falta en el grupo firebase_config}"
          : "${VITE_FIREBASE_MEASUREMENT_ID:?falta en el grupo firebase_config}"
          : "${VITE_ADMIN_EMAIL:?falta en el grupo firebase_config}"
          : "${VITE_FIREBASE_VAPID_KEY:?falta en el grupo firebase_config}"
          printf '%s\n' \
            "VITE_FIREBASE_API_KEY=$VITE_FIREBASE_API_KEY" \
            "VITE_FIREBASE_AUTH_DOMAIN=$VITE_FIREBASE_AUTH_DOMAIN" \
            "VITE_FIREBASE_PROJECT_ID=$VITE_FIREBASE_PROJECT_ID" \
            "VITE_FIREBASE_STORAGE_BUCKET=$VITE_FIREBASE_STORAGE_BUCKET" \
            "VITE_FIREBASE_MESSAGING_SENDER_ID=$VITE_FIREBASE_MESSAGING_SENDER_ID" \
            "VITE_FIREBASE_APP_ID=$VITE_FIREBASE_APP_ID" \
            "VITE_FIREBASE_MEASUREMENT_ID=$VITE_FIREBASE_MEASUREMENT_ID" \
            "VITE_ADMIN_EMAIL=$VITE_ADMIN_EMAIL" \
            "VITE_FIREBASE_VAPID_KEY=$VITE_FIREBASE_VAPID_KEY" \
            "VITE_APPCHECK_SITE_KEY=${VITE_APPCHECK_SITE_KEY:-}" \
            > .env
          # OJO: NUNCA hacer `cat .env` aquí — volcaría las claves al log del build.
          echo "--- .env creado con $(wc -l < .env) variables ---"
      - name: Build web assets
        script: |
          npm run build
      - name: Sync Capacitor iOS
        script: |
          npx cap sync ios
      - name: Fix iOS bundle identifier and set production entitlements
        script: |
          # iOS does NOT allow underscores in bundle IDs
          # Override the bundle ID that Capacitor sets from capacitor.config.json
          sed -i '' "s/PRODUCT_BUNDLE_IDENTIFIER = .*/PRODUCT_BUNDLE_IDENTIFIER = $IOS_BUNDLE_ID;/" "$XCODE_PROJECT/project.pbxproj"
          echo "Bundle ID set to: $IOS_BUNDLE_ID"
          grep "PRODUCT_BUNDLE_IDENTIFIER" "$XCODE_PROJECT/project.pbxproj"
          # Set aps-environment to production for App Store build
          sed -i '' "s/<string>development<\/string>/<string>production<\/string>/" ios/App/App/App.entitlements
          echo "Entitlements updated to production:"
          cat ios/App/App/App.entitlements
      - name: Set marketing version and build number
        script: |
          # Cada entrega al App Store necesita una marketing version nueva.
          # PUNTO ÚNICO DE VERDAD: la versión sale de package.json, la misma que Vite
          # inyecta como __APP_VERSION__ en la etiqueta "Versión App" de Ajustes. Antes
          # estaba escrita a mano aquí y había que acordarse de tocar los dos sitios.
          # Para publicar una versión nueva: sube "version" en package.json y ya.
          NEW_VERSION=$(node -p "require('./package.json').version")
          sed -i '' "s/MARKETING_VERSION = [^;]*;/MARKETING_VERSION = $NEW_VERSION;/g" "$XCODE_PROJECT/project.pbxproj"
          echo "Marketing version -> $NEW_VERSION"
          grep -m2 "MARKETING_VERSION" "$XCODE_PROJECT/project.pbxproj"
          # Build number interno (incrementa en cada subida a App Store Connect)
          NEW_BUILD=172
          echo "Build number -> $NEW_BUILD"
          cd ios/App
          agvtool new-version -all "$NEW_BUILD"
      - name: Set up code signing settings on Xcode project
        script: |
          xcode-project use-profiles --project "$XCODE_PROJECT"
      - name: Resolve Swift Package Manager dependencies
        script: |
          xcodebuild -resolvePackageDependencies -project "$XCODE_PROJECT" -scheme "$XCODE_SCHEME"
      - name: Build iOS App
        script: |
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME" \
            --export-options-plist /Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        api_key: $APP_STORE_APPLE_PRIVATE_KEY
        key_id: $APP_STORE_APPLE_KEY_ID
        issuer_id: $APP_STORE_APPLE_ISSUER_ID
        submit_to_testflight: true
