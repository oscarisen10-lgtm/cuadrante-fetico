workflows:
  # ───────────────────────────────────────────────────────────────────────────
  # Despliegue de Firebase (reglas, índices y functions) CON RED DE SEGURIDAD.
  #
  # Antes esto se hacía a mano (`firebase deploy` desde el portátil) y nada
  # comprobaba las reglas antes de que llegaran a producción, pese a que
  # tests/rules/firestore.test.js ya cubre lo importante (escalada de
  # privilegios, membership, custom-claims, aislamiento entre usuarios).
  # Una regla mal escrita podía dejar datos de plantilla al descubierto —o
  # bloquear la app entera— sin que nada lo parase.
  #
  # Aquí los tests corren SIEMPRE antes del despliegue y, si fallan, no se
  # despliega nada: `set -e` corta el paso y Codemagic aborta el workflow.
  #
  # Se dispara a mano desde Codemagic ("Start new build" → firebase-workflow).
  # No está en `triggering` a propósito: desplegar reglas es una acción
  # deliberada, no algo que deba pasar solo al hacer push.
  #
  # REQUISITO ÚNICO: un grupo de variables `firebase_deploy` en Codemagic con
  # FIREBASE_TOKEN (generado con `firebase login:ci`). Si falta, el workflow
  # corta ANTES de tocar nada.
  # ───────────────────────────────────────────────────────────────────────────
  firebase-workflow:
    name: Firebase Rules & Functions Deploy
    max_build_duration: 30
    instance_type: mac_mini_m1
    environment:
      groups:
        - firebase_deploy
      node: latest
    scripts:
      - name: Install dependencies
        script: |
          set -eu
          npm install
          npm --prefix functions install
      - name: Lint
        script: |
          npm run lint
      - name: Unit tests
        script: |
          npm test
      - name: Firestore rules tests (emulador)
        script: |
          set -eu
          # firebase-tools EXIGE Java 21+ (con el 17 corta con un error explícito).
          # Los runners suelen traer varias versiones, así que se comprueba y, si la
          # activa es anterior, se intenta la 21 antes de rendirse.
          if ! java -version 2>&1 | grep -qE '"(2[1-9]|[3-9][0-9])'; then
            echo "Java activo < 21; intentando seleccionar la 21..."
            export JAVA_HOME="$(/usr/libexec/java_home -v 21)"
            export PATH="$JAVA_HOME/bin:$PATH"
          fi
          java -version
          npm install -g firebase-tools
          # Levanta el emulador, corre los tests de reglas y lo apaga solo.
          # Si un test falla, este paso devuelve != 0 y el workflow se detiene
          # AQUÍ: no se llega al despliegue.
          npm run test:rules
      - name: Cloud Functions tests (emulador)
        script: |
          set -eu
          # Los tests de reglas comprueban el DOCUMENTO resultante; estos comprueban
          # la FUNCIÓN que lo escribe (quién puede gestionar a quién, qué degrada una
          # cuenta a pendiente, el enfriamiento de los push). Sin ellos, una regresión
          # de autorización en functions/ no la paraba nada antes de producción.
          #
          # Repite la comprobación de Java 21 del paso anterior EN VEZ DE asumir que
          # el JAVA_HOME exportado allí sigue activo aquí: Codemagic normalmente
          # encadena el entorno entre pasos del mismo build, pero este paso también
          # depende del emulador de Firestore y no vale la pena dejarlo colgado de un
          # comportamiento entre pasos que no se puede verificar sin ejecutar el CI.
          if ! java -version 2>&1 | grep -qE '"(2[1-9]|[3-9][0-9])'; then
            export JAVA_HOME="$(/usr/libexec/java_home -v 21)"
            export PATH="$JAVA_HOME/bin:$PATH"
          fi
          # Necesitan functions/node_modules: el paso de instalación solo hace la raíz
          # en algunos runners, así que se asegura aquí.
          npm --prefix functions install
          npm run test:functions
      - name: Deploy Firestore rules, indexes and functions
        script: |
          set -eu
          : "${FIREBASE_TOKEN:?falta FIREBASE_TOKEN en el grupo firebase_deploy}"
          # El proyecto se indica explícitamente con --project y no se confía en
          # .firebaserc. (Ese fichero aparece en .gitignore, pero se versionó ANTES
          # de añadir la regla y .gitignore no desengancha lo ya trackeado: sí llega
          # al clon. Indicarlo a mano hace el despliegue independiente de eso.)
          #
          # SIN --force a propósito: con esa bandera, `deploy` BORRARÍA sin
          # preguntar cualquier función que ya no se exporte. Un `git revert`
          # desafortunado se llevaría por delante funciones vivas de producción.
          # En modo no interactivo, Firebase avisa de las sobrantes y no las
          # toca; retirarlas es un acto manual y consciente:
          #   firebase functions:delete <nombre> --region europe-west1
          firebase deploy \
            --only firestore:rules,firestore:indexes,functions \
            --project mi-calendario-fe \
            --non-interactive \
            --token "$FIREBASE_TOKEN"

  ios-workflow:
    name: iOS App Store Build
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      groups:
        - apple_credentials
        # Config de Firebase para el .env del build. Se define en Codemagic >
        # Settings > Environment variables (grupo `firebase_config`). Antes estaba
        # aquí en texto plano y, por tanto, versionada en GitHub.
        # Variables que debe contener: VITE_FIREBASE_API_KEY, VITE_FIREBASE_AUTH_DOMAIN,
        # VITE_FIREBASE_PROJECT_ID, VITE_FIREBASE_STORAGE_BUCKET,
        # VITE_FIREBASE_MESSAGING_SENDER_ID, VITE_FIREBASE_APP_ID,
        # VITE_FIREBASE_MEASUREMENT_ID, VITE_ADMIN_EMAIL, VITE_FIREBASE_VAPID_KEY
        # y (opcional, cuando se active App Check) VITE_APPCHECK_SITE_KEY.
        - firebase_config
      vars:
        XCODE_SCHEME: "App"
        XCODE_PROJECT: "ios/App/App.xcodeproj"
        IOS_BUNDLE_ID: "com.cuadrantefetico.app"
      node: latest
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.cuadrantefetico.app
    scripts:
      - name: Install dependencies
        script: |
          npm install
      - name: Lint
        script: |
          # Falla solo con errores; los avisos no cortan el build.
          npm run lint
      - name: Run unit tests
        script: |
          # Si un test falla, el build se corta aquí y no llega nada roto a TestFlight.
          npm test
      - name: Create environment file
        script: |
          # .env está en .gitignore, así que hay que recrearlo para el build. Los
          # valores vienen del grupo cifrado `firebase_config` de Codemagic, NO del
          # repositorio. Si falta alguno, el build corta aquí en vez de generar un
          # .env a medias que produciría una app rota en TestFlight.
          set -eu
          : "${VITE_FIREBASE_API_KEY:?falta en el grupo firebase_config}"
          : "${VITE_FIREBASE_AUTH_DOMAIN:?falta en el grupo firebase_config}"
          : "${VITE_FIREBASE_PROJECT_ID:?falta en el grupo firebase_config}"
          : "${VITE_FIREBASE_STORAGE_BUCKET:?falta en el grupo firebase_config}"
          : "${VITE_FIREBASE_MESSAGING_SENDER_ID:?falta en el grupo firebase_config}"
          : "${VITE_FIREBASE_APP_ID:?falta en el grupo firebase_config}"
          : "${VITE_FIREBASE_MEASUREMENT_ID:?falta en el grupo firebase_config}"
          : "${VITE_ADMIN_EMAIL:?falta en el grupo firebase_config}"
          : "${VITE_FIREBASE_VAPID_KEY:?falta en el grupo firebase_config}"
          printf '%s\n' \
            "VITE_FIREBASE_API_KEY=$VITE_FIREBASE_API_KEY" \
            "VITE_FIREBASE_AUTH_DOMAIN=$VITE_FIREBASE_AUTH_DOMAIN" \
            "VITE_FIREBASE_PROJECT_ID=$VITE_FIREBASE_PROJECT_ID" \
            "VITE_FIREBASE_STORAGE_BUCKET=$VITE_FIREBASE_STORAGE_BUCKET" \
            "VITE_FIREBASE_MESSAGING_SENDER_ID=$VITE_FIREBASE_MESSAGING_SENDER_ID" \
            "VITE_FIREBASE_APP_ID=$VITE_FIREBASE_APP_ID" \
            "VITE_FIREBASE_MEASUREMENT_ID=$VITE_FIREBASE_MEASUREMENT_ID" \
            "VITE_ADMIN_EMAIL=$VITE_ADMIN_EMAIL" \
            "VITE_FIREBASE_VAPID_KEY=$VITE_FIREBASE_VAPID_KEY" \
            "VITE_APPCHECK_SITE_KEY=${VITE_APPCHECK_SITE_KEY:-}" \
            > .env
          # OJO: NUNCA hacer `cat .env` aquí — volcaría las claves al log del build.
          echo "--- .env creado con $(wc -l < .env) variables ---"
      - name: Build web assets
        script: |
          npm run build
      - name: Sync Capacitor iOS
        script: |
          npx cap sync ios
      - name: Fix iOS bundle identifier and set production entitlements
        script: |
          # iOS does NOT allow underscores in bundle IDs
          # Override the bundle ID that Capacitor sets from capacitor.config.json
          sed -i '' "s/PRODUCT_BUNDLE_IDENTIFIER = .*/PRODUCT_BUNDLE_IDENTIFIER = $IOS_BUNDLE_ID;/" "$XCODE_PROJECT/project.pbxproj"
          echo "Bundle ID set to: $IOS_BUNDLE_ID"
          grep "PRODUCT_BUNDLE_IDENTIFIER" "$XCODE_PROJECT/project.pbxproj"
          # Set aps-environment to production for App Store build
          sed -i '' "s/<string>development<\/string>/<string>production<\/string>/" ios/App/App/App.entitlements
          echo "Entitlements updated to production:"
          cat ios/App/App/App.entitlements
      - name: Set marketing version and build number
        script: |
          # Cada entrega al App Store necesita una marketing version nueva.
          # PUNTO ÚNICO DE VERDAD: la versión sale de package.json, la misma que Vite
          # inyecta como __APP_VERSION__ en la etiqueta "Versión App" de Ajustes. Antes
          # estaba escrita a mano aquí y había que acordarse de tocar los dos sitios.
          # Para publicar una versión nueva: sube "version" en package.json y ya.
          NEW_VERSION=$(node -p "require('./package.json').version")
          sed -i '' "s/MARKETING_VERSION = [^;]*;/MARKETING_VERSION = $NEW_VERSION;/g" "$XCODE_PROJECT/project.pbxproj"
          echo "Marketing version -> $NEW_VERSION"
          grep -m2 "MARKETING_VERSION" "$XCODE_PROJECT/project.pbxproj"
          # Build number interno (incrementa en cada subida a App Store Connect)
          # Un número de build no se puede reutilizar en App Store Connect. El 180 fue
          # el último intentado; esta es la 3.8.1, así que sube a 181 sin más.
          NEW_BUILD=181
          echo "Build number -> $NEW_BUILD"
          cd ios/App
          agvtool new-version -all "$NEW_BUILD"
      - name: Set up code signing settings on Xcode project
        script: |
          xcode-project use-profiles --project "$XCODE_PROJECT"
      - name: Resolve Swift Package Manager dependencies
        script: |
          xcodebuild -resolvePackageDependencies -project "$XCODE_PROJECT" -scheme "$XCODE_SCHEME"
      - name: Build iOS App
        script: |
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME" \
            --export-options-plist /Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        api_key: $APP_STORE_APPLE_PRIVATE_KEY
        key_id: $APP_STORE_APPLE_KEY_ID
        issuer_id: $APP_STORE_APPLE_ISSUER_ID
        # La build SIGUE subiendo a App Store Connect y aparece en TestFlight al
        # instante para los testers INTERNOS; lo que ya no se hace solo es enviarla a
        # la revisión beta, que únicamente hace falta para testers EXTERNOS.
        #
        # Estaba en true y por eso el build 174 murió con un 422 de Apple: solo admite
        # UNA build en revisión beta por "train" (= marketing version), y el 173 de la
        # misma 3.6.0 seguía en revisión. Reconstruir la misma versión chocaba siempre.
        # Enviar a revisión externa se hace ahora a mano desde App Store Connect, que
        # además es cuando de verdad se quiere.
        submit_to_testflight: false
